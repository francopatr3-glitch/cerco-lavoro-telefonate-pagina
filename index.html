<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B57A8">
<title>Telefonate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B57A8'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%98%8F%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #F6F7F9; }
  @media (prefers-color-scheme: dark) { html, body { background: #151A22; } }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<!-- Contenitore del programma Telefonate (progetto Apps Script «Cerco lavoro - Telefonate», accesso: solo il proprietario). Serve a non mostrare la scritta di Google. -->
<iframe src="https://script.google.com/macros/s/AKfycbw6bQyCpDVbnNdTbeQGhK4unJSTBcxayKb8-JPw027iQxKj9HY9XkO9xEI3s9lwxQri/exec" title="Telefonate" allow="clipboard-write"></iframe>
<script>
// «✉ Invia subito» (Franco, 16-10-2026): il programma avvisa questa pagina, questa pagina chiama n8n sul PC
// che fa subito il suo giro. La prima volta Chrome chiede il permesso per la rete locale.
// Se n8n non risponde (n8n spento) o si è sul telefono non succede niente: resta il controllo di n8n ogni 5 minuti.
// Sul telefono n8n e il Programma Appunti non ci sono (stanno sul PC): la pagina non li cerca, altrimenti Chrome del
// telefono chiede «vuole accedere ad altri servizi e app su questo dispositivo» (Franco, 20-10-2026).
var TELEFONO = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || !!(navigator.userAgentData && navigator.userAgentData.mobile);
window.addEventListener('message', function (e) {
  if (TELEFONO) return;
  if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
  if (!e.data) return;
  if (e.data.telefonate === 'invia-subito')
    fetch('http://localhost:5678/webhook/cerco-lavoro-invia-subito', { method: 'POST', mode: 'no-cors', targetAddressSpace: 'loopback' }).catch(function () {});
  if (e.data.telefonate === 'appunti-porta' && e.ports && e.ports[0]) appunti(e.ports[0]);
});

// «✎ Appunti della telefonata» (Franco, 19-10-2026): il programma dà a questa pagina un canale; questa pagina chiede
// al Programma Appunti sul PC (http://localhost:5681) a che punto è la telefonata e gli dice quale azienda è aperta.
// Ogni 2 secondi; se il Programma Appunti non risponde (PC senza il programma) si riprova ogni 30 secondi.
var APPUNTI = 'http://localhost:5681', portaAppunti = null, giroAppunti = null;
function appunti(porta) {
  portaAppunti = porta;
  porta.onmessage = function (m) {
    var d = m.data || {};
    if (d.tipo === 'aperta') manda('/aperta', d);
    if (d.tipo === 'chiama') manda('/chiama', d);
    if (d.tipo === 'salvato') manda('/salvato', { id: d.id });
    // «▶ Ascolta» (Franco, 20-10-2026): la voce della telefonata tenuta 3 giorni sul PC passa al programma
    if (d.tipo === 'voce' && /^ap\d{12}$/.test(d.id || ''))
      fetch(APPUNTI + '/voce?id=' + d.id, { cache: 'no-store', targetAddressSpace: 'loopback' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(function (b) { porta.postMessage({ tipo: 'voce', id: d.id, dati: b }, [b]); })
        .catch(function () { porta.postMessage({ tipo: 'voce', id: d.id, errore: true }); });
  };
  if (!giroAppunti) chiedi();
}
function manda(via, dati) {
  fetch(APPUNTI + via, { method: 'POST', body: JSON.stringify(dati), headers: { 'Content-Type': 'text/plain' }, targetAddressSpace: 'loopback' }).catch(function () {});
}
function chiedi() {
  fetch(APPUNTI + '/stato', { cache: 'no-store', targetAddressSpace: 'loopback' })
    .then(function (r) { return r.json(); })
    .then(function (s) { if (portaAppunti) portaAppunti.postMessage({ tipo: 'stato', stato: s }); giroAppunti = setTimeout(chiedi, 2000); })
    .catch(function () { giroAppunti = setTimeout(chiedi, 30000); });
}
</script>
</body>
</html>

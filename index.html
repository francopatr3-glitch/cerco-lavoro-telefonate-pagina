<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B57A8">
<title>Telefonate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B57A8'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%98%8F%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #F6F7F9; }
  @media (prefers-color-scheme: dark) { html, body { background: #151A22; } }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<!-- Contenitore del programma Telefonate (progetto Apps Script «Cerco lavoro - Telefonate», accesso: solo il proprietario). Serve a non mostrare la scritta di Google. -->
<iframe src="https://script.google.com/macros/s/AKfycbw6bQyCpDVbnNdTbeQGhK4unJSTBcxayKb8-JPw027iQxKj9HY9XkO9xEI3s9lwxQri/exec" title="Telefonate" allow="clipboard-write"></iframe>
<script>
// «✉ Invia subito» (Franco, 16-10-2026): il programma avvisa questa pagina, questa pagina chiama n8n sul PC
// che fa subito il suo giro. La prima volta Chrome chiede il permesso per la rete locale.
// Se n8n non risponde (telefono, n8n spento) non succede niente: resta il controllo di n8n ogni 5 minuti.
window.addEventListener('message', function (e) {
  if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
  if (!e.data || e.data.telefonate !== 'invia-subito') return;
  fetch('http://localhost:5678/webhook/cerco-lavoro-invia-subito', { method: 'POST', mode: 'no-cors', targetAddressSpace: 'loopback' }).catch(function () {});
});
</script>
</body>
</html>
